<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>PageGist — Store Icon 128×128</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px; gap: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .label { color: #666; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
  .hint { color: #444; font-size: 11px; margin-top: 4px; text-align: center; }
  .sizes { display: flex; align-items: flex-end; gap: 32px; margin-top: 16px; }
  .size-label { color: #555; font-size: 10px; text-align: center; margin-bottom: 6px; }

  /* ── Icon ── */
  .icon {
    background: #3b82f6;
    border-radius: 22.5%;  /* Chrome CWS rounds to ~22.5% */
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* inner glow */
  .icon::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 60%);
  }
</style>
</head>
<body>

<span class="label">Store icon — screenshot the 128×128 version with DevTools at 128×128</span>

<div class="sizes">
  <div>
    <div class="size-label">16px</div>
    <div class="icon" style="width:16px;height:16px;border-radius:3px;">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 12h6M9 16h4m2 4H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/>
      </svg>
    </div>
  </div>
  <div>
    <div class="size-label">48px</div>
    <div class="icon" style="width:48px;height:48px;border-radius:11px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 12h6M9 16h4m2 4H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/>
        <path d="M14 4v4a1 1 0 0 0 1 1h4"/>
        <circle cx="9" cy="9" r="1.5" fill="white" stroke="none"/>
      </svg>
    </div>
  </div>
  <div>
    <div class="size-label">128px — screenshot this one</div>
    <div class="icon" style="width:128px;height:128px;border-radius:29px;">
      <!-- Sparkle top-right accent -->
      <svg style="position:absolute;top:10px;right:10px;opacity:0.4;" width="18" height="18" viewBox="0 0 24 24" fill="white">
        <path d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/>
      </svg>
      <!-- Main document icon -->
      <svg width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="position:relative;z-index:1;">
        <path d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25Z"/>
      </svg>
    </div>
  </div>
</div>

<div class="hint">
  DevTools → device toolbar → 128×128 → focus just the large icon → ⌘⇧P → Capture screenshot<br/>
  Repeat at 16×16 and 48×48 for the other sizes required by the manifest.
</div>

</body>
</html>
